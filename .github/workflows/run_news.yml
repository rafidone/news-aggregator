name: Manual News Digest

# The scheduled digest now runs on the bot host (see crontab) so that the
# SQLite history/favorites used by the interactive buttons persists between
# runs. GitHub Actions keeps only a manual escape hatch.

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-flash-latest
          GEMINI_TIMEOUT: "120"
        run: python main.py
